<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhotoFind — administration</title><link rel="stylesheet" href="/static/style.css?v=8"></head><body><main><header><a class="brand" href="/">✳ PHOTO<span>FIND</span></a><nav><a href="/">Mes galeries</a> <button id="logout" class="text-button">Déconnexion</button></nav></header><section class="hero"><div class="eyebrow">ADMINISTRATION</div><h1>Comptes <em>et permissions.</em></h1></section><section class="card"><h2>Créer un compte</h2><form id="create-user" class="account-form"><label>Identifiant<input name="username" required minlength="3" maxlength="64" autocomplete="off"></label><label>Mot de passe initial<input name="password" type="password" required minlength="8" maxlength="256" autocomplete="new-password"></label><label>Rôle<select name="role"><option value="photographer">Photographe</option><option value="admin">Administrateur</option></select></label><button class="button">Créer le compte</button></form></section><p id="admin-status" class="status" role="status"></p><section id="accounts" class="accounts"></section><footer>Les changements de compte révoquent ses sessions. Les administrateurs disposent de tous les droits.</footer></main><script src="/static/admin.js?v=8"></script></body></html>
