services:
  photofind:
    build: .
    pull_policy: build
    restart: unless-stopped
    environment:
      SECURE_COOKIES: "true"
    ports:
      - "127.0.0.1:18080:8000"
    volumes:
      - type: bind
        source: /mnt/data/PhotoFind
        target: /data
        bind:
          create_host_path: false
